[package]
name = "bili-dl"
version = "2.0.0"
edition = "2024"
description = "使用deepseek参照yt-dlp构建的b站视频下载器"
authors = ["dmqf dmqf12@gmail.com"]
license = "LGPL-2.1-only"
repository = "https://github.com/dmqf12/bili-dl"

[[bin]]
path = "src/bin/bili-dl.rs"
name = "bili-dl"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["query", "json", "rustls", "stream", "gzip", "deflate", "brotli", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.11"
url = "2"
anyhow = "1"
regex = "1"
futures-util = "0.3"
mp4forge = { version = "0.8", features = ["mux"] }
